
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-ingress
  namespace: voting-app
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-ingress
  namespace: voting-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /result(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: result-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-assets-ingress
  namespace: voting-app
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
          - path: /stylesheets
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
          - path: /javascripts
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
          - path: /css
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
