
name: Ironhack Project 2 - EKS CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build Docker Images and Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::686699774218:role/IronhackP2DeployAbdul
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: |
            abdulqudus0306/vote:${{ github.sha }}
            abdulqudus0306/vote:latest

      - name: Build and push Result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: |
            abdulqudus0306/result:${{ github.sha }}
            abdulqudus0306/result:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            abdulqudus0306/worker:${{ github.sha }}
            abdulqudus0306/worker:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name eks-abdul-voting-p2

      - name: Apply Kubernetes manifests
        run: |
          mkdir -p /tmp/voting-k8s
          cp k8s/*.yaml /tmp/voting-k8s/

          sed -i \
            -e "s|abdulqudus0306/vote:latest|abdulqudus0306/vote:${GITHUB_SHA}|g" \
            -e "s|abdulqudus0306/result:latest|abdulqudus0306/result:${GITHUB_SHA}|g" \
            -e "s|abdulqudus0306/worker:latest|abdulqudus0306/worker:${GITHUB_SHA}|g" \
            /tmp/voting-k8s/apps.yaml

          kubectl apply -n voting-app -f /tmp/voting-k8s/

      - name: Verify deployments
        run: |
          for app in vote result worker; do
            kubectl rollout status \
              deployment/$app \
              -n voting-app \
              --timeout=300s
          done

          kubectl get pods -n voting-app
